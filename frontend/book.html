<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book equipment – LabBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container">
    <a href="equipment.html" class="small text-decoration-none">&larr; Back to equipment</a>
    <h1 class="h3 mt-2 mb-1" id="item-name">Loading...</h1>
    <p class="text-muted mb-4" id="item-info"></p>

    <div id="message" class="d-none"></div>

    <div class="card shadow-sm dash-card">
      <div class="card-body p-4">
        <form id="booking-form" novalidate>

          <!-- Step 1: date -->
          <div class="mb-4" style="max-width: 260px;">
            <label for="date" class="form-label fw-semibold">1. Choose a date</label>
            <input type="date" id="date" class="form-control">
          </div>

          <!-- Step 2: slot -->
          <div class="mb-4">
            <div class="form-label fw-semibold">2. Choose a time slot</div>
            <div class="d-flex flex-wrap gap-2" id="slots"></div>
            <div class="small text-muted mt-2">
              <span class="badge text-bg-light border">Free</span>
              <span class="badge text-bg-secondary">Booked</span>
              <span class="badge text-bg-primary">Your choice</span>
            </div>
          </div>

          <!-- Step 3: purpose -->
          <div class="mb-4">
            <label for="purpose" class="form-label fw-semibold">3. Purpose</label>
            <textarea id="purpose" class="form-control" rows="2" maxlength="200"
                      placeholder="e.g. Experiment 4 – measuring rise time"></textarea>
          </div>

          <button type="submit" class="btn btn-primary">Confirm booking</button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/book.js"></script>
</body>
</html>
