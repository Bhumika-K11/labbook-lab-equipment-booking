<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment – LabBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- The navigation bar is built by layout.js -->
  <nav id="navbar"></nav>

  <main class="container">
    <h1 class="h3 mb-1">Equipment</h1>
    <p class="text-muted mb-4">Choose an available item to book a one-hour slot.</p>

    <!-- Error messages appear here -->
    <div id="message" class="d-none"></div>

    <!-- Filter by lab -->
    <div class="row mb-3">
      <div class="col-12 col-md-4">
        <label for="lab-filter" class="form-label">Show lab</label>
        <select id="lab-filter" class="form-select">
          <option value="">All labs</option>
        </select>
      </div>
    </div>

    <!-- Equipment table -->
    <div class="card shadow-sm dash-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Code</th>
              <th>Name</th>
              <th>Lab</th>
              <th>Status</th>
              <th class="text-end">Action</th>
            </tr>
          </thead>
          <tbody id="equipment-body">
            <tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/equipment.js"></script>
</body>
</html>
