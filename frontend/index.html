<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – LabBook</title>
  <!-- Bootstrap 5 (styling library) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Our own styles -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm mt-5">
          <div class="card-body p-4">

            <h1 class="h3 mb-1 text-center">LabBook</h1>
            <p class="text-muted text-center small mb-4">Laboratory Equipment Booking &amp; Fault Reporting</p>

            <!-- Success / error messages appear here -->
            <div id="message" class="d-none"></div>

            <form id="login-form" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="student1@example.edu" autocomplete="username">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" autocomplete="current-password">
              </div>
              <button type="submit" class="btn btn-primary w-100">Log in</button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Load our JavaScript: the helper first, then this page's script -->
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
