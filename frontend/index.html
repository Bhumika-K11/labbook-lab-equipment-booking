<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabBook</title>
</head>
<body>
  <h1>LabBook</h1>
  <p>Laboratory Equipment Booking and Fault Reporting System</p>

  <!-- The message from the backend will appear here -->
  <p id="status">Checking backend...</p>

  <script>
    // The frontend asks the backend for data using fetch()
    fetch("/api/health")
      .then(response => response.json())      // turn the reply into a JavaScript object
      .then(data => {
        // show the backend's message on the page
        document.getElementById("status").textContent = "✅ " + data.message;
      })
      .catch(() => {
        document.getElementById("status").textContent = "❌ Backend not reachable";
      });
  </script>
</body>
</html>
