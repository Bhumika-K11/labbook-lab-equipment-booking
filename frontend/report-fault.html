<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report a fault – LabBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container">
    <h1 class="h3 mb-1">Report a fault</h1>
    <p class="text-muted mb-4">Tell the lab staff when a piece of equipment is broken or not working properly.</p>

    <div id="message" class="d-none"></div>

    <!-- Report form -->
    <div class="card shadow-sm dash-card mb-4">
      <div class="card-body p-4">
        <form id="fault-form" novalidate>
          <div class="row g-3">
            <div class="col-12 col-md-8">
              <label for="equipment" class="form-label fw-semibold">Equipment</label>
              <select id="equipment" class="form-select">
                <option value="">Choose equipment...</option>
              </select>
            </div>
            <div class="col-12 col-md-4">
              <label for="severity" class="form-label fw-semibold">Severity</label>
              <select id="severity" class="form-select">
                <option value="">Choose...</option>
                <option value="Low">Low – small problem, still usable</option>
                <option value="Medium">Medium – works badly</option>
                <option value="High">High – not working / unsafe</option>
              </select>
            </div>
            <div class="col-12">
              <label for="description" class="form-label fw-semibold">What is the problem?</label>
              <textarea id="description" class="form-control" rows="3" maxlength="500"
                        placeholder="e.g. Channel 2 shows no signal even with a known good probe"></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-danger mt-3">Submit report</button>
        </form>
      </div>
    </div>

    <!-- My reports -->
    <h2 class="h5 mb-3">My reports</h2>
    <div class="card shadow-sm dash-card">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Reported on</th>
              <th>Equipment</th>
              <th>Problem</th>
              <th>Severity</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="faults-body">
            <tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/report-fault.js"></script>
</body>
</html>
